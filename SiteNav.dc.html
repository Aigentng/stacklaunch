<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</helmet>
<header style="--nav-basis:260px;background:rgba(6,8,16,.72);backdropFilter:blur(16px);borderBottom:1px solid rgba(255,255,255,.09);fontFamily:'Inter',sans-serif">
  <div data-navrow style="maxWidth:1320px;margin:0 auto;padding:0 clamp(20px,4vw,56px);boxSizing:border-box;minHeight:72px;display:flex;alignItems:center;justifyContent:space-between;gap:clamp(10px,1.6vw,24px);flexWrap:wrap;paddingTop:12px;paddingBottom:12px">
    <a href="Home.dc.html" style="order:1;display:flex;alignItems:center;gap:11px;textDecoration:none;flexShrink:0">
      <img src="ds/assets/logo-mark-dark.png" alt="" style="height:24px;width:auto;display:block" />
      <img src="ds/assets/logo-wordmark-dark.png" alt="StackLaunch" style="height:17px;width:auto;display:block" />
    </a>
    <nav style="order:2;flex:1 1 var(--nav-basis,260px);display:flex;alignItems:center;gap:0;flexWrap:nowrap;justifyContent:center;minWidth:0;overflowX:auto;scrollbarWidth:none;WebkitOverflowScrolling:touch">
      <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
        <a href="{{ link.href }}" style="padding:8px clamp(6px,1vw,14px);borderRadius:999px;fontFamily:'JetBrains Mono',monospace;fontSize:clamp(9.5px,0.82vw,11px);letterSpacing:clamp(0.05em,0.6vw,0.14em);textTransform:uppercase;color:rgba(233,238,246,.66);textDecoration:none;whiteSpace:nowrap;transition:all 220ms cubic-bezier(.2,.8,.25,1)" style-hover="color:#F2F5FA;background:rgba(255,255,255,.05)">
          <sc-if value="{{ link.isActive }}" hint-placeholder-val="{{ false }}"><span style="color:#F2F5FA">{{ link.label }}</span></sc-if>
          <sc-if value="{{ link.isInactive }}" hint-placeholder-val="{{ true }}">{{ link.label }}</sc-if>
        </a>
      </sc-for>
    </nav>
    <a href="https://calendly.com/michuk-dev/30min" target="_blank" rel="noopener noreferrer" style="display:inline-flex;alignItems:center;gap:9px;padding:10px clamp(11px,2.2vw,18px);borderRadius:999px;background:#F2F5FA;color:#060810;fontSize:clamp(11.5px,1.15vw,13px);fontWeight:500;textDecoration:none;whiteSpace:nowrap;flexShrink:0;order:3;marginLeft:auto;transition:all 220ms cubic-bezier(.2,.8,.25,1)" style-hover="background:#3B82F6;color:#fff">Book a free review<span style="fontFamily:'JetBrains Mono',monospace;fontSize:12px">&rsaquo;</span></a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;about&quot;,&quot;why&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    return {
      links: [
        ['Home', 'Home.dc.html', 'home'],
        ['Services', 'Services.dc.html', 'services'],
        ['About', 'About.dc.html', 'about'],
        ['Why StackLaunch', 'Why-StackLaunch.dc.html', 'why'],
        ['Contact', 'Contact.dc.html', 'contact'],
      ].map(([label, href, key]) => ({ label, href, isActive: key === active, isInactive: key !== active })),
    };
  }
}
</script>
</body>
</html>
