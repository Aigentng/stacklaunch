hero:
  eyebrow: Mobile backend infrastructure
  headlineLine1: You build the app.
  headlineLead: "We make it "
  headlineAccentA: production
  headlineAccentB: -ready.
  body: StackLaunch runs the secure, scalable cloud backend behind your app. From AWS to Kubernetes to monitoring, we handle it, so you can focus on growing your product instead of firefighting your servers.
  primaryCtaLabel: Book a free infrastructure review
  secondaryCtaLabel: See what we handle
  trustLeft: Runs on AWS · Kubernetes · Terraform
  trustRight: All client platforms healthy

problem:
  eyebrow: 01 · The problem
  heading: The gap between it works and it goes live
  accentPhraseA: it works
  accentPhraseB: it goes live
  intro: You built the app and it runs well in the demo. Then real users come on board, and the hard questions begin.
  items:
    - n: "01"
      a: Traffic triples overnight.
      b: Will it scale, or fall over?
    - n: "02"
      a: The database locks at 3am.
      b: Who gets the alert? Anyone?
    - n: "03"
      a: Something important gets deleted.
      b: Is there a backup to restore?
    - n: "04"
      a: A breach makes the news.
      b: Is your setup actually safe?
  closing: Hiring a full platform team costs months you do not have and a salary most startups are not ready for. Closing that gap is exactly what we do for you.

howWeHelp:
  eyebrow: 02 · How we help
  heading: The layer between your app and a bad week
  accentPhrase: and a bad week
  panelsLabel: 003 panels · live
  reliabilityTitle: We hear about it before your users do
  reliabilityBody: Metrics, logs and alerts are wired to a rotation that answers. Backups run nightly and get restored on purpose, not in a panic.
  reachTitle: Close to your users, with somewhere to fail over to
  reachBody: Traffic is served from the region nearest each user, and the failover region is tested every month, not assumed.
  automationTitle: Any release can be put back in one command
  automationBody: "Build, migrate and roll out run as one pipeline. When a release misbehaves, the last good version goes back in minutes."

marquee:
  plainWords: "Secure · Scalable · Monitored · "
