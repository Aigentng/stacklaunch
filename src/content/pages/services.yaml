hero:
  eyebrow: Services
  heading: Everything behind your app, handled.
  accentPhrase: handled.
  body: |-
    Your developers continue building the product. StackLaunch takes ownership of the production infrastructure around it: deployments, scaling, monitoring, databases,
    background processing, push notification pipelines, caching, security, backups and incident recovery.
  primaryCtaLabel: Book a free infrastructure review
  secondaryCtaLabel: See the stack
services:
  - n: '001'
    icon: cloud
    title: Production Infrastructure
    promise: Your backend, ready for real users.
    body: Deploy and operate APIs, containers and supporting cloud infrastructure.
    span: span 2
  - n: '002'
    icon: server
    title: Background Jobs & Workers
    promise: Jobs keep moving, even when things fail.
    body: Queues, workers, autoscaling, retries, DLQs and failed-job recovery.
    span: span 2
  - n: '003'
    icon: git-branch
    title: Push Notifications
    promise: From app event to user's device.
    body: FCM/APNs pipelines, notification workers, retries, monitoring and delivery troubleshooting.
    span: span 2
  - n: '004'
    icon: activity
    title: Monitoring & Reliability
    promise: Know before your users do.
    body: API health, worker failures, queue backlogs, database performance, dashboards and alert.
    span: span 2
  - n: '005'
    icon: shield-check
    title: Database Operations
    promise: Your production data, looked after.
    body: PostgreSQL monitoring, backups, connections, performance, security and recovery.
    span: span 2
  - n: '006'
    icon: archive-restore
    title: Security & API Protection
    promise: Secure by design.
    body: |-
      Identity, secrets, encryption, least privilege,
      network access and API protection.
    span: span 2
  - n: '007'
    icon: database
    title: Scaling & Performance
    promise: Ready when traffic arrives.
    body: Scale APIs and workers with demand while avoiding unnecessary infrastructure spend.
    span: span 2
  - n: '008'
    icon: dollar-sign
    title: Backup & Disaster Recovery
    promise: A bad day, not a fatal one.
    body: Automated backups, recovery procedures, restore testing and incident runbooks.
    span: span 2
  - n: '009'
    icon: terminal
    title: Managed platform operations
    promise: Hand us the backend. Go build.
    body: Ongoing management of infrastructure, clusters, deployments and maintenance. A platform team without the headcount.
    span: span 6
marquee:
  beforeAccent: AWS · Kubernetes · Terraform ·
  accentWord: PostgreSQL
  afterAccent: · Prometheus · Go ·
stack:
  eyebrow: The stack
  heading: The technology behind it
  accentPhrase: we build on
  body: Proven technology for reliable, production-ready mobile backends
  groups:
    - label: Cloud & Compute
      items:
        - AWS
        - Google Cloud
        - Firebase
        - ECS/Fargate
        - Cloud Run
    - label: Messaging & Notifications
      items:
        - SQS
        - SNS
        - Firebase Cloud Messaging
    - label: Data & Caching
      items:
        - PostgreSQL
        - Firestore
        - Redis / Valkey
        - S3
        - Cloud Storage
    - label: Monitoring & Reliability
      items:
        - CloudWatch
        - Cloud Logging
        - Prometheus
        - Grafana
        - OpenTelemetry
closingCta:
  heading: Not sure which of these you need?
  accentPhrase: you need?
  body: That is what the free review is for. We will tell you what is solid, what is a risk, and what to fix first.
  ctaLabel: Book a free infrastructure review
